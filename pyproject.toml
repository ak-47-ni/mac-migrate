[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mac-migrate"
version = "0.1.0"
description = "Safe macOS developer environment backup and restore utility"
readme = "README.md"
requires-python = ">=3.8"
dependencies = []

[project.scripts]
mac-migrate = "mac_migrate.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
